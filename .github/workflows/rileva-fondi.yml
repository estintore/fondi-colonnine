name: Rileva fondi colonnine

on:
  schedule:
    # ogni giorno alle 20:00 UTC (22:00 in estate, 21:00 in inverno, ora italiana)
    - cron: "0 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rileva-fondi
  cancel-in-progress: false

jobs:
  rileva:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Controlla che i file siano al posto giusto
        run: |
          ls -la
          test -f requirements.txt || { echo "::error::requirements.txt non è nella radice del repository"; exit 1; }
          test -f scraper/scrape.py || { echo "::error::scraper/scrape.py non è nella radice del repository"; exit 1; }

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Leggi i fondi dalla dashboard
        run: python scraper/scrape.py
        env:
          # facoltative: Settings → Secrets and variables → Actions → Variables
          KEYWORD: ${{ vars.KEYWORD }}
          REPORT_URL: ${{ vars.REPORT_URL }}

      - name: Salva screenshot e dati di debug
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debug
          path: debug/
          retention-days: 7

      - name: Salva il nuovo valore nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.csv
          if git diff --staged --quiet; then
            echo "Nessuna variazione."
          else
            git commit -m "Fondi al $(TZ=Europe/Rome date +%F)"
            git push
          fi
